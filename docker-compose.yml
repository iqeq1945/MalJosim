version: "3.8"

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:16-alpine
    container_name: filtering_postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # 로컬 5432와 충돌 방지 (기본값 5433)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-filtering}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: filtering_redis
    ports:
      - "${REDIS_PORT:-6380}:6379" # 로컬 6379와 충돌 방지 (기본값 6380)
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB 벡터 스토어
  chromadb:
    image: chromadb/chroma:latest
    container_name: filtering_chromadb
    ports:
      - "${CHROMA_PORT:-8000}:8000" # 필요시 8001 등으로 변경 가능
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
